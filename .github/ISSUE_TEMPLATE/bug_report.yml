name: Bug report
description: Something in Bugmole doesn't work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Using the dashboard? **Report a bug** in the app attaches screenshots, logs and your environment for you.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. bugmole --mode run --plan-id ...\n2. ..."
  - type: input
    id: version
    attributes:
      label: Bugmole version
      description: Output of `npm ls -g @bugmole/cli`
  - type: input
    id: env
    attributes:
      label: OS and Node.js version
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Remove any secrets first.
      render: shell
